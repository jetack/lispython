site_name: LisPython
site_url: https://jetack.github.io/lispython/
site_description: >-
  LisPython is a Lisp-flavored syntax for Python: .lpy source compiles to
  Python AST and runs on CPython, with Clojure-style macros.

# The macros module and hooks live in docs/ but are no pages to publish.
exclude_docs: |
  *.py
  __pycache__/

copyright: Copyright &copy; 2023-2026 Jetack

plugins:
  - macros:
      module_name: docs/main
      # lispython code is full of {{ and {%: only pages with render_macros: true
      # in their front matter are templates.
      render_by_default: false
  - search
  - mike

# After the plugins: llms.txt / llms-full.txt / llms-syntax.txt from the rendered markdown.
hooks:
  - docs/hooks.py

# Under --strict, a link to a missing heading fails the build.
validation:
  anchors: warn

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.instant
    - navigation.footer
    - content.action.edit
    - content.tabs.link
    - header.repo
    - header.version
  palette:
    scheme: default
  icon:
    repo: fontawesome/brands/git-alt

repo_url: https://github.com/jetack/lispython
repo_name: jetack/lispython
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Why LisPy?: why-lispy.md
  - Usage:
      - Getting Started: usage/getting-started.md
      - Command Line Interface: usage/cli.md
  - Syntax:
      - Overview: syntax/overview.md
      - Statements: syntax/statements.md
      - Expressions: syntax/expressions.md
      - Form Reference: syntax/reference.md
  - Macros: macros.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - codehilite
  - footnotes
  - meta
  - toc:
      permalink: true

extra:
  # The pages of llms-syntax.txt, in this order: what an agent needs to write
  # lispython (docs/hooks.py). Each must be a nav page.
  llms_syntax_pages:
    - syntax/overview.md
    - syntax/statements.md
    - syntax/expressions.md
    - syntax/reference.md
    - macros.md
  version:
    provider: mike
  analytics:
    provider: google
    property: G-4S2VF6T0D0
