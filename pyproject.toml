[project]
name = "lispython"
version = "0.5.0"
description = "Lisp-like Syntax for Python with Lisp-like Macros"
authors = [{ name = "Jetack", email = "jetack23@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "prompt-toolkit>=3.0.52",
    "pygls>=2.0",
]

[project.urls]
Homepage = "https://jetack.github.io/lispython"
Repository = "https://github.com/jetack/lispython"

[project.scripts]
lpy = "lispy:run"
l2py = "lispy:l2py"
lpy-lsp = "lispy.lsp:main"
test = "pytest:main"

[project.optional-dependencies]
dev = [
    "pre-commit>=3.6.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "toml>=0.10.2",
]
docs = [
    "mkdocs-material>=9.6.14",
    "mkdocs-macros-plugin>=1.3.7",
    "mike>=2.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lispy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# AST constructor misuse (unknown keywords, missing fields) warns on 3.13/3.14
# and is a TypeError from 3.15: fail the suite on the warning.
filterwarnings = [
    "error::DeprecationWarning",
    # pygls (third-party) calls asyncio.iscoroutinefunction, deprecated in 3.14.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["lispy"]
