[project]
name = "lispython"
version = "0.6.0"
description = "Lisp-like Syntax for Python with Lisp-like Macros"
authors = [{ name = "Jetack", email = "jetack23@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "prompt-toolkit>=3.0.52",
    "pygls>=2.0",
]

[project.urls]
Homepage = "https://jetack.github.io/lispython"
Repository = "https://github.com/jetack/lispython"

[project.scripts]
lpy = "lispy:run"
l2py = "lispy:l2py"
lpy-lsp = "lispy.lsp:main"

# The lispython Pygments lexer, found by its alias (```lispython fences).
[project.entry-points."pygments.lexers"]
lispython = "lispy.highlight:LispythonLexer"

[project.optional-dependencies]
dev = [
    # tests/test_docs_hooks.py builds mkdocs' own File/Page objects.
    "mkdocs>=1.6.1,<2",
    "pre-commit>=3.6.0",
    # lispy.highlight (tests/test_highlight.py). 2.20: 2.19 calls
    # os.path.commonprefix, deprecated in 3.15, so the DeprecationWarning error
    # filter breaks every lexer, pytest's failure highlighting included.
    "pygments>=2.20",
    "pytest>=8.0.0",
    # tests/test_ci_workflow.py reads the workflow's matrix.
    "pyyaml>=6.0",
    "ruff>=0.8.0",
    "toml>=0.10.2",
]
# The LSP's Python backends (lispy.lsp.backend): basedpyright, with its own Node,
# the default; pyrefly, the second backend, selected by the backend setting.
lsp = [
    "basedpyright>=1.40",
    "pyrefly>=1.4",
]
docs = [
    "mkdocs-material>=9.6.14",
    "mkdocs-macros-plugin>=1.3.7",
    "mike>=2.1.3",
    # lispy.highlight, the lexer of the ```lispython fences. 2.20: see dev.
    "pygments>=2.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lispy"]

# The sdist ships an explicit list, never "everything .gitignore allows":
# hatchling drops every .gitignore exclusion when the project root itself
# matches one, as any checkout under the ignored .claude/worktrees/ does, and
# the sdist then carried agent symlinks and .claude/settings.local.json.
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/mkdocs.yml",
  "/noxfile.py",
  "/uv.lock",
  "/README.md",
  "/LICENSE.md",
  "/CHANGELOG.md",
]
exclude = ["__pycache__", "*.py[cod]"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# AST constructor misuse (unknown keywords, missing fields) warns on 3.13/3.14
# and is a TypeError from 3.15: fail the suite on the warning. A SyntaxWarning
# (the deprecated \" in an f-string field, as CPython's invalid escape
# sequences) fails it too unless the test expects it.
filterwarnings = [
    "error::DeprecationWarning",
    "error::SyntaxWarning",
    # pygls (third-party) calls asyncio.iscoroutinefunction, deprecated in 3.14.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Generated from core_meta_functions.lpy by l2py (tests/test_meta_functions.py checks
# it byte for byte), so its shape is the transpiler's, not ruff's.
"src/lispy/core/meta_functions.py" = ["E", "F", "I", "UP"]
# The compiler modules share one namespace on purpose (`from ... import *`).
"src/lispy/core/compiler/*.py" = ["F403", "F405"]
"src/lispy/core/macro.py" = ["F403", "F405"]
"src/lispy/core/parser.py" = ["F403", "F405"]
# Package __init__ imports run for their side effects or re-export.
"src/lispy/__init__.py" = ["F401"]
"src/lispy/lsp/__init__.py" = ["F401"]
"src/lispy/macros/__init__.py" = ["F401", "F403"]

[tool.ruff.format]
# Generated file (see above); the docs' python fences keep the layout the page
# compares with its lispython fence, not ruff's.
exclude = ["src/lispy/core/meta_functions.py", "docs/**/*.md"]

[tool.ruff.lint.isort]
known-first-party = ["lispy"]
