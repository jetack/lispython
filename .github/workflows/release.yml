# Tests every push to main and every pull request on the whole supported range,
# and publishes lispython to PyPI when a `v*` tag is pushed. The test job is
# one home for both, so a release cannot publish code the matrix did not pass.
# It shares this file with the publish job because HQ's CI gate (the
# `# hq:test-gate` and `# hq:deploy-job` markers) needs both in one workflow,
# and the file keeps its name because the PyPI trusted publisher is bound to
# release.yml. No token: PyPI Trusted Publishing (OIDC). The PyPI trusted
# publisher must match owner jetack, repo lispython, workflow release.yml,
# environment pypi. Only the publish job holds the OIDC permission, and it runs
# no project code (it just uploads the built artifact).
# The test matrix must equal noxfile.py PYTHONS (tests/test_ci_workflow.py).
name: CI and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions: {}

jobs:
  test:
    name: Test # hq:test-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: false
      - run: uv run --frozen --python ${{ matrix.python }} --extra dev --extra lsp --extra lsp-basedpyright pytest

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: false
      - name: Verify tag matches pyproject version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          if [ "$version" != "${REF_NAME#v}" ]; then
            echo "tag $REF_NAME does not match pyproject version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Verify tagged commit is on main
        env:
          SHA: ${{ github.sha }}
        run: |
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "tag must point at a commit on main" >&2
            exit 1
          fi
      - run: uv build
      - name: Check built artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: uv run --no-project python .github/scripts/check_dist.py dist "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI # hq:deploy-job
    # hq:deploy-on-tag
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/lispython/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: false
      - name: Upload to PyPI # hq:deploy-step
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*
